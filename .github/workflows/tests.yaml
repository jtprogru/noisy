name: testing

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -v -race -coverprofile=cover.out ./...
